name: Daily TV Media Schedule Pull

on:
  schedule:
    # Runs at 09:00 UTC every day (~2-3am Mountain, adjust as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  fetch-tvmedia-highlights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pull today's highlights from TV Media (Sample Plan, US Eastern generic lineup)
        env:
          TVMEDIA_API_KEY: ${{ secrets.TVMEDIA_API_KEY }}
        run: |
          mkdir -p data
          DATE=$(date -u +%Y-%m-%d)
          curl -s "https://api.tvmedia.ca/tv/v4/lineups/36617/listings/highlights?api_key=${TVMEDIA_API_KEY}&start=${DATE}" \
            -o "data/tvmedia-${DATE}.json"
          # Also keep a "latest" file that always points to today's pull
          cp "data/tvmedia-${DATE}.json" data/tvmedia-latest.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Daily TV Media schedule pull $(date -u +%Y-%m-%d)"
          git push
